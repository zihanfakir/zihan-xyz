<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zihan Fakir | Official Portfolio</title>
  <script>
    (function() {
      try {
        var h = window.location.hostname.toLowerCase();
        var p = window.location.pathname;
        var cleanPath = p.replace(/^\/(zihan-xyz|zihan-uk)/i, '');
        var cleanSegment = cleanPath.replace(/^\/+/, '').replace(/\/+$/, '').toLowerCase();
        if (cleanSegment.slice(-5) === '.html') cleanSegment = cleanSegment.slice(0, -5);
        
        var validRoutes = ['about', 'projects', 'skills', 'certificates', 'education', 'resume', 'contact'];
        var targetFile = validRoutes.indexOf(cleanSegment) !== -1 ? ('/' + cleanSegment + '.html') : '/';
        
        var isLocal = h === 'localhost' || h === '127.0.0.1' || h.startsWith('192.168.');
        var targetDomain = isLocal ? '' : 'https://zihan.uk';
        
        window.location.replace(targetDomain + targetFile + window.location.search + window.location.hash);
      } catch(e) {
        window.location.replace('https://zihan.uk/');
      }
    })();
  </script>
  <style>
    body {
      background: #090d16;
      color: #94a3b8;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(99, 102, 241, 0.2);
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div>
    <div class="spinner"></div>
    <p style="font-size: 1.05rem; color: #f8fafc; font-weight: 600; margin: 0 0 6px;">Loading Zihan Fakir Portfolio...</p>
    <p style="font-size: 0.88rem; margin: 0;">Routing to verified domain (zihan.uk)...</p>
  </div>
</body>
</html>
