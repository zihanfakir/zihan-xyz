<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="alokpo-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="alokpo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>
  <rect width="600" height="380" fill="url(#alokpo-bg)"/>

  <g transform="translate(30, 20)">
    <!-- Browser Window Frame -->
    <rect width="540" height="340" rx="14" fill="#0f172a" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    <circle cx="24" cy="20" r="6" fill="#ef4444"/>
    <circle cx="42" cy="20" r="6" fill="#f59e0b"/>
    <circle cx="60" cy="20" r="6" fill="#10b981"/>
    <line x1="0" y1="38" x2="540" y2="38" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

    <!-- Search Engine Branding -->
    <text x="270" y="80" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="800" fill="url(#alokpo-grad)" text-anchor="middle" letter-spacing="-0.5">Alokpo</text>
    <text x="270" y="100" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Decoupled Web Search Engine &amp; Crawler API</text>

    <!-- Search Bar Mockup -->
    <rect x="70" y="115" width="400" height="42" rx="21" fill="#1e293b" stroke="rgba(99, 102, 241, 0.5)" stroke-width="1.5"/>
    <circle cx="95" cy="136" r="6" fill="none" stroke="#6366f1" stroke-width="2"/>
    <line x1="100" y1="140" x2="106" y2="146" stroke="#6366f1" stroke-width="2"/>
    <text x="115" y="141" font-family="sans-serif" font-size="13" fill="#f1f5f9">web development architecture</text>
    <rect x="380" y="121" width="80" height="30" rx="15" fill="url(#alokpo-grad)"/>
    <text x="420" y="140" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">Search</text>

    <!-- Search Results Section Mockup -->
    <!-- Result Item 1 -->
    <rect x="70" y="175" width="400" height="65" rx="8" fill="#141e33" stroke="rgba(255,255,255,0.04)"/>
    <text x="85" y="195" font-family="sans-serif" font-size="13" font-weight="bold" fill="#38bdf8">Modern Web Application Architecture Guide</text>
    <text x="85" y="210" font-family="monospace" font-size="10" fill="#10b981">https://zihan.xyz/articles/architecture</text>
    <text x="85" y="226" font-family="sans-serif" font-size="10.5" fill="#94a3b8">Comprehensive exploration of decoupled APIs, caching strategies, and frontend performance...</text>

    <!-- Result Item 2 -->
    <rect x="70" y="250" width="400" height="65" rx="8" fill="#141e33" stroke="rgba(255,255,255,0.04)"/>
    <text x="85" y="270" font-family="sans-serif" font-size="13" font-weight="bold" fill="#38bdf8">Alokpo Indexing &amp; Crawler API Documentation</text>
    <text x="85" y="285" font-family="monospace" font-size="10" fill="#10b981">https://api.alokpo.com/v1/search</text>
    <text x="85" y="301" font-family="sans-serif" font-size="10.5" fill="#94a3b8">High-throughput search engine backend indexing millions of public web nodes in real time...</text>

    <!-- Query speed badge -->
    <rect x="375" y="55" width="95" height="20" rx="10" fill="rgba(16, 185, 129, 0.15)" stroke="rgba(16, 185, 129, 0.3)"/>
    <text x="422" y="69" font-family="sans-serif" font-size="9" font-weight="bold" fill="#34d399" text-anchor="middle">⚡ 0.042s response</text>
  </g>
</svg>
