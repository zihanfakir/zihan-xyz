<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="avatar-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa" />
      <stop offset="100%" stop-color="#fdba74" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="400" rx="32" fill="url(#avatar-bg)"/>
  
  <!-- Subtle Grid Pattern in background -->
  <g stroke="rgba(255,255,255,0.05)" stroke-width="1">
    <line x1="50" y1="0" x2="50" y2="400" />
    <line x1="100" y1="0" x2="100" y2="400" />
    <line x1="150" y1="0" x2="150" y2="400" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="250" y1="0" x2="250" y2="400" />
    <line x1="300" y1="0" x2="300" y2="400" />
    <line x1="350" y1="0" x2="350" y2="400" />
    <line x1="0" y1="50" x2="400" y2="50" />
    <line x1="0" y1="100" x2="400" y2="100" />
    <line x1="0" y1="150" x2="400" y2="150" />
    <line x1="0" y1="200" x2="400" y2="200" />
    <line x1="0" y1="250" x2="400" y2="250" />
    <line x1="0" y1="300" x2="400" y2="300" />
    <line x1="0" y1="350" x2="400" y2="350" />
  </g>

  <!-- Developer Silhouette / Character -->
  <!-- Hoodie / Shoulders -->
  <path d="M90 400 C90 320 130 280 200 280 C270 280 310 320 310 400 Z" fill="url(#accent-grad)"/>
  <path d="M120 400 C120 335 150 300 200 300 C250 300 280 335 280 400 Z" fill="#0f172a" opacity="0.6"/>

  <!-- Neck -->
  <rect x="175" y="220" width="50" height="70" rx="10" fill="url(#skin)" />

  <!-- Head -->
  <circle cx="200" cy="180" r="65" fill="url(#skin)"/>

  <!-- Modern Hair -->
  <path d="M130 170 C130 110 150 90 200 90 C250 90 270 110 270 170 C255 130 230 115 200 115 C170 115 145 130 130 170 Z" fill="#1e293b"/>
  <path d="M135 150 C140 100 200 85 240 95 C265 102 268 135 268 150 C250 120 220 110 180 118 C155 122 140 135 135 150 Z" fill="#0f172a"/>

  <!-- Glasses -->
  <rect x="150" y="165" width="42" height="26" rx="8" fill="none" stroke="#ffffff" stroke-width="4"/>
  <rect x="208" y="165" width="42" height="26" rx="8" fill="none" stroke="#ffffff" stroke-width="4"/>
  <line x1="192" y1="178" x2="208" y2="178" stroke="#ffffff" stroke-width="4"/>
  <line x1="135" y1="175" x2="150" y2="175" stroke="#ffffff" stroke-width="3"/>
  <line x1="250" y1="175" x2="265" y2="175" stroke="#ffffff" stroke-width="3"/>

  <!-- Eyes reflection -->
  <circle cx="170" cy="178" r="3" fill="#6366f1" />
  <circle cx="230" cy="178" r="3" fill="#6366f1" />

  <!-- Friendly Smile -->
  <path d="M185 215 Q200 228 215 215" fill="none" stroke="#c2410c" stroke-width="3" stroke-linecap="round"/>

  <!-- Sleek Headset / Headphones -->
  <path d="M130 180 C130 120 155 95 200 95 C245 95 270 120 270 180" fill="none" stroke="#06b6d4" stroke-width="8" stroke-linecap="round"/>
  <rect x="120" y="160" width="18" height="42" rx="9" fill="#06b6d4" />
  <rect x="262" y="160" width="18" height="42" rx="9" fill="#06b6d4" />

  <!-- Code brackets badge overlay -->
  <g transform="translate(40, 50)">
    <circle cx="20" cy="20" r="24" fill="#1e1b4b" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
    <text x="20" y="27" font-family="monospace" font-size="20" font-weight="bold" fill="#06b6d4" text-anchor="middle">&lt;/&gt;</text>
  </g>
</svg>
