<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="calc-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b" />
      <stop offset="50%" stop-color="#1c2541" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="calc-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>
  <rect width="600" height="380" fill="url(#calc-bg)"/>

  <g transform="translate(30, 20)">
    <!-- Main Window Container -->
    <rect width="540" height="340" rx="14" fill="#0f172a" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    <circle cx="24" cy="20" r="6" fill="#ef4444"/>
    <circle cx="42" cy="20" r="6" fill="#f59e0b"/>
    <circle cx="60" cy="20" r="6" fill="#10b981"/>
    <line x1="0" y1="38" x2="540" y2="38" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

    <!-- App Header -->
    <text x="270" y="70" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">🎂 বয়স ক্যালকুলেটর (Age Calculator)</text>
    <text x="270" y="90" font-family="sans-serif" font-size="11" fill="#06b6d4" text-anchor="middle">by @zihanfakir • v26.0</text>

    <!-- Date Input Mockup Box -->
    <rect x="110" y="105" width="320" height="38" rx="8" fill="#1e293b" stroke="rgba(99, 102, 241, 0.4)" stroke-width="1.5"/>
    <text x="130" y="129" font-family="sans-serif" font-size="13" fill="#cbd5e1">📅 জন্ম তারিখ: 2002-05-15</text>
    <rect x="340" y="112" width="80" height="24" rx="5" fill="url(#calc-accent)"/>
    <text x="380" y="128" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">হিসাব করুন</text>

    <!-- Live Counter Metric Cards Grid -->
    <!-- Years -->
    <rect x="35" y="158" width="105" height="75" rx="10" fill="#1e293b" stroke="rgba(255,255,255,0.06)"/>
    <text x="87" y="195" font-family="sans-serif" font-size="22" font-weight="bold" fill="#38bdf8" text-anchor="middle">24</text>
    <text x="87" y="218" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">বছর (Years)</text>

    <!-- Months -->
    <rect x="155" y="158" width="105" height="75" rx="10" fill="#1e293b" stroke="rgba(255,255,255,0.06)"/>
    <text x="207" y="195" font-family="sans-serif" font-size="22" font-weight="bold" fill="#a78bfa" text-anchor="middle">3</text>
    <text x="207" y="218" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">মাস (Months)</text>

    <!-- Days -->
    <rect x="275" y="158" width="105" height="75" rx="10" fill="#1e293b" stroke="rgba(255,255,255,0.06)"/>
    <text x="327" y="195" font-family="sans-serif" font-size="22" font-weight="bold" fill="#34d399" text-anchor="middle">19</text>
    <text x="327" y="218" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">দিন (Days)</text>

    <!-- Seconds (Live Ticking) -->
    <rect x="395" y="158" width="110" height="75" rx="10" fill="#1e293b" stroke="#6366f1" stroke-width="1.5"/>
    <circle cx="488" cy="172" r="4" fill="#10b981"/>
    <text x="450" y="195" font-family="monospace" font-size="20" font-weight="bold" fill="#f43f5e" text-anchor="middle">48s</text>
    <text x="450" y="218" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">সেকেন্ড (Live)</text>

    <!-- Fun Stats Ribbon at Bottom -->
    <rect x="35" y="248" width="470" height="70" rx="10" fill="#131d35" stroke="rgba(255,255,255,0.05)"/>
    <text x="50" y="272" font-family="sans-serif" font-size="12" font-weight="bold" fill="#f8fafc">🔢 মজার তথ্য ও পরিসংখ্যান (Fun Facts):</text>
    <text x="50" y="295" font-family="sans-serif" font-size="11" fill="#94a3b8">❤️ আনুমানিক হৃদস্পন্দন: 984+ মিলিয়ন বার | 🌬️ মোট শ্বাসপ্রশ্বাস: 215+ মিলিয়ন বার</text>
    <text x="50" y="310" font-family="sans-serif" font-size="11" fill="#38bdf8">🎉 পরবর্তী জন্মদিন বাকি: 8 মাস 12 দিন</text>
  </g>
</svg>
