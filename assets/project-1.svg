<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="alok-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="alok-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="alok-bot-badge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="380" fill="url(#alok-bg)"/>
  
  <!-- Subtle Ambient Glow -->
  <circle cx="500" cy="80" r="140" fill="#6366f1" opacity="0.18" filter="blur(40px)"/>
  <circle cx="100" cy="300" r="120" fill="#a855f7" opacity="0.15" filter="blur(40px)"/>

  <!-- App Window Container -->
  <g transform="translate(24, 20)">
    <!-- Main Window Background -->
    <rect width="552" height="340" rx="14" fill="#0b0f19" stroke="rgba(99, 102, 241, 0.28)" stroke-width="1.5"/>

    <!-- Window Header -->
    <rect width="552" height="42" rx="14" fill="#111827"/>
    <rect y="30" width="552" height="12" fill="#111827"/>
    <line x1="0" y1="42" x2="552" y2="42" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

    <!-- Window Controls -->
    <circle cx="22" cy="21" r="5.5" fill="#ef4444" opacity="0.9"/>
    <circle cx="38" cy="21" r="5.5" fill="#f59e0b" opacity="0.9"/>
    <circle cx="54" cy="21" r="5.5" fill="#10b981" opacity="0.9"/>

    <!-- App Logo & Title -->
    <g transform="translate(76, 12)">
      <rect width="18" height="18" rx="5" fill="url(#alok-primary)"/>
      <path d="M 5 9 L 9 5 L 13 9 L 9 13 Z" fill="#ffffff"/>
      <text x="24" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">আলোকপথ AI</text>
      <text x="100" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="500" fill="#94a3b8">• 11 Frontier Models</text>
    </g>

    <!-- Model Selection Pills -->
    <g transform="translate(280, 10)">
      <rect x="0" y="0" width="62" height="22" rx="6" fill="rgba(99, 102, 241, 0.2)" stroke="rgba(99, 102, 241, 0.4)" stroke-width="1"/>
      <text x="31" y="14" font-family="sans-serif" font-size="9.5" font-weight="600" fill="#a5b4fc" text-anchor="middle">DeepSeek</text>

      <rect x="68" y="0" width="58" height="22" rx="6" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
      <text x="97" y="14" font-family="sans-serif" font-size="9.5" font-weight="500" fill="#94a3b8" text-anchor="middle">Gemini</text>

      <rect x="132" y="0" width="56" height="22" rx="6" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
      <text x="160" y="14" font-family="sans-serif" font-size="9.5" font-weight="500" fill="#94a3b8" text-anchor="middle">Claude</text>

      <rect x="194" y="0" width="54" height="22" rx="6" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
      <text x="221" y="14" font-family="sans-serif" font-size="9.5" font-weight="500" fill="#94a3b8" text-anchor="middle">GPT-4o</text>
    </g>

    <!-- Chat Messages Body -->
    <!-- User Bubble -->
    <g transform="translate(180, 56)">
      <rect width="350" height="42" rx="12" fill="url(#alok-primary)"/>
      <text x="18" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#ffffff">একটি আধুনিক Full Stack AI ওয়েব অ্যাপ কীভাবে শুরু করব?</text>
    </g>

    <!-- Bot Bubble with Avatar -->
    <g transform="translate(20, 110)">
      <!-- Bot Avatar -->
      <circle cx="16" cy="16" r="16" fill="url(#alok-bot-badge)"/>
      <path d="M 11 12 H 21 V 20 H 11 Z M 16 7 V 12 M 9 16 H 11 M 21 16 H 23" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" fill="none"/>
      
      <!-- Bot Bubble Container -->
      <g transform="translate(42, 0)">
        <rect width="468" height="135" rx="12" fill="#1e293b" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
        
        <!-- Model Tag inside Bot Response -->
        <rect x="14" y="12" width="138" height="18" rx="9" fill="rgba(99, 102, 241, 0.25)"/>
        <circle cx="22" cy="21" r="3.5" fill="#10b981"/>
        <text x="32" y="24" font-family="sans-serif" font-size="9" font-weight="600" fill="#a5b4fc">DeepSeek-R1 • Streaming</text>

        <!-- Bot Response Lines -->
        <text x="14" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#38bdf8">১. ফ্রন্টএন্ড ইন্টারফেস:</text>
        <text x="14" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cbd5e1">React/Next.js এবং Tailwind CSS দিয়ে রেসপন্সিভ বাংলা UI তৈরি করুন।</text>
        
        <text x="14" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#a855f7">২. সুরক্ষিত ক্লাউড প্রক্সি আর্কিটেকচার:</text>
        <text x="14" y="106" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cbd5e1">ক্লায়েন্টে কোনো API key প্রকাশ না করে ব্যাকএন্ডের মাধ্যমে রিয়েল-টাইম টোকেন স্ট্রিম করুন।</text>

        <!-- Pulsing cursor effect -->
        <rect x="448" y="96" width="2" height="13" fill="#6366f1"/>
      </g>
    </g>

    <!-- Bottom Input Area Bar -->
    <g transform="translate(20, 268)">
      <rect width="512" height="52" rx="10" fill="#131d31" stroke="rgba(99, 102, 241, 0.2)" stroke-width="1"/>
      
      <!-- Attachment icons -->
      <circle cx="26" cy="26" r="12" fill="rgba(255,255,255,0.05)"/>
      <path d="M 22 26 L 30 26 M 26 22 L 26 30" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
      
      <circle cx="56" cy="26" r="12" fill="rgba(255,255,255,0.05)"/>
      <path d="M 52 23 H 60 V 29 H 52 Z M 54 26 L 56 24 L 58 27" stroke="#94a3b8" stroke-width="1.2" stroke-linejoin="round" fill="none"/>

      <!-- Placeholder Text -->
      <text x="78" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b">আলোকপথ AI-কে যেকোনো কিছু জিজ্ঞাসা করুন...</text>

      <!-- Security Status Badge -->
      <g transform="translate(375, 15)">
        <rect width="84" height="22" rx="11" fill="rgba(16, 185, 129, 0.15)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1"/>
        <circle cx="10" cy="11" r="3" fill="#10b981"/>
        <text x="18" y="14" font-family="sans-serif" font-size="9" font-weight="600" fill="#34d399">100% Secure</text>
      </g>

      <!-- Send Button -->
      <rect x="468" y="10" width="34" height="32" rx="8" fill="url(#alok-primary)"/>
      <path d="M 480 26 L 490 20 L 485 30 L 484 27 L 480 26 Z" fill="#ffffff"/>
    </g>
  </g>
</svg>
